<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 타격전 | 이지워킹 AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ewa-bg: #0d0f14;
        --ewa-text: #e4e5eb;
        --ewa-accent: #f0a500;
        --ewa-bg-card: #1a1d27;
        --ewa-border: rgba(255, 255, 255, 0.06);
        --ewa-text-dim: #9398a8;
        --ewa-accent-dim: rgba(240, 165, 0, 0.12);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        background: var(--ewa-bg);
        color: var(--ewa-text);
        font-family: "Noto Sans KR", sans-serif;
        min-height: 100vh;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }

      body {
        padding: 24px 16px 60px;
      }

      .container {
        max-width: 900px;
        margin: 0 auto;
      }

      /* ===== Header ===== */
      .site-header {
        text-align: center;
        margin-bottom: 32px;
      }
      .site-header a {
        color: var(--ewa-text-dim);
        text-decoration: none;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.5px;
      }
      .site-header a:hover {
        color: var(--ewa-accent);
      }

      /* ===== Screens ===== */
      .screen {
        display: none;
        animation: fadeIn 0.45s ease;
      }
      .screen.active {
        display: block;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* ===== Title screen ===== */
      .title-wrap {
        text-align: center;
        padding: 48px 16px 24px;
      }
      .title-badge {
        display: inline-block;
        background: var(--ewa-accent-dim);
        color: var(--ewa-accent);
        font-size: 13px;
        font-weight: 700;
        padding: 6px 14px;
        border-radius: 20px;
        margin-bottom: 24px;
        letter-spacing: 0.5px;
      }
      .title-main {
        font-size: clamp(40px, 9vw, 72px);
        font-weight: 900;
        line-height: 1.1;
        margin-bottom: 18px;
        background: linear-gradient(135deg, var(--ewa-text) 0%, var(--ewa-accent) 120%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        letter-spacing: -1px;
      }
      .title-sub {
        font-size: clamp(16px, 2.4vw, 19px);
        color: var(--ewa-text-dim);
        margin-bottom: 40px;
        font-weight: 400;
      }
      .how-it-works {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
        margin: 0 auto 40px;
        max-width: 720px;
      }
      .step {
        background: var(--ewa-bg-card);
        border: 1px solid var(--ewa-border);
        border-radius: 12px;
        padding: 18px 14px;
        text-align: center;
      }
      .step-num {
        width: 28px;
        height: 28px;
        background: var(--ewa-accent-dim);
        color: var(--ewa-accent);
        border-radius: 50%;
        font-weight: 700;
        font-size: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 10px;
      }
      .step-text {
        font-size: 13px;
        color: var(--ewa-text-dim);
        line-height: 1.45;
      }

      /* ===== Buttons ===== */
      .btn {
        display: inline-block;
        background: var(--ewa-accent);
        color: #1a1300;
        border: none;
        font-family: inherit;
        font-size: 17px;
        font-weight: 700;
        padding: 16px 44px;
        border-radius: 12px;
        cursor: pointer;
        transition:
          transform 0.15s ease,
          box-shadow 0.2s ease,
          background 0.2s ease;
        letter-spacing: -0.3px;
      }
      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(240, 165, 0, 0.3);
      }
      .btn:active {
        transform: translateY(0);
      }
      .btn-secondary {
        background: transparent;
        color: var(--ewa-text);
        border: 1px solid var(--ewa-border);
      }
      .btn-secondary:hover {
        background: var(--ewa-bg-card);
        border-color: rgba(255, 255, 255, 0.18);
        box-shadow: none;
      }

      /* ===== Progress ===== */
      .progress-bar {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-bottom: 24px;
        font-size: 13px;
        color: var(--ewa-text-dim);
        font-weight: 500;
      }
      .progress-dot {
        width: 24px;
        height: 6px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.1);
        transition: background 0.3s ease;
      }
      .progress-dot.done {
        background: var(--ewa-accent);
        opacity: 0.5;
      }
      .progress-dot.current {
        background: var(--ewa-accent);
      }

      /* ===== Prompt card ===== */
      .prompt-card {
        background: var(--ewa-bg-card);
        border: 1px solid var(--ewa-border);
        border-left: 3px solid var(--ewa-accent);
        border-radius: 12px;
        padding: 20px 22px;
        margin-bottom: 28px;
      }
      .prompt-label {
        font-size: 11px;
        font-weight: 700;
        color: var(--ewa-accent);
        letter-spacing: 1px;
        text-transform: uppercase;
        margin-bottom: 8px;
      }
      .prompt-text {
        font-size: clamp(18px, 2.6vw, 22px);
        font-weight: 700;
        line-height: 1.4;
      }

      /* ===== Response cards ===== */
      .cards-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-bottom: 28px;
      }
      .response-card {
        background: var(--ewa-bg-card);
        border: 2px solid var(--ewa-border);
        border-radius: 16px;
        padding: 22px;
        cursor: pointer;
        transition:
          border-color 0.25s ease,
          transform 0.2s ease,
          box-shadow 0.25s ease;
        position: relative;
        display: flex;
        flex-direction: column;
      }
      .response-card:hover {
        border-color: rgba(240, 165, 0, 0.4);
        transform: translateY(-3px);
      }
      .response-card.selected {
        border-color: var(--ewa-accent);
        box-shadow:
          0 0 0 3px var(--ewa-accent-dim),
          0 12px 36px rgba(240, 165, 0, 0.15);
      }
      .response-card.faded {
        opacity: 0.4;
      }
      .card-header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 16px;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--ewa-border);
      }
      .card-label {
        width: 34px;
        height: 34px;
        background: var(--ewa-accent);
        color: #1a1300;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 900;
        font-size: 17px;
        flex-shrink: 0;
      }
      .card-label-text {
        font-weight: 700;
        font-size: 15px;
        color: var(--ewa-text-dim);
      }
      .card-body {
        font-size: 15px;
        color: var(--ewa-text);
        line-height: 1.75;
        white-space: pre-wrap;
        flex: 1;
        min-height: 180px;
      }
      .card-vote-btn {
        margin-top: 18px;
        width: 100%;
        background: transparent;
        border: 1.5px solid var(--ewa-border);
        color: var(--ewa-text);
        font-family: inherit;
        font-size: 15px;
        font-weight: 700;
        padding: 12px;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .response-card:hover .card-vote-btn {
        border-color: var(--ewa-accent);
        color: var(--ewa-accent);
      }

      /* ===== Reveal state ===== */
      .reveal-banner {
        background: var(--ewa-bg-card);
        border: 1px solid var(--ewa-border);
        border-radius: 12px;
        padding: 18px 22px;
        margin-bottom: 24px;
        text-align: center;
        animation: fadeIn 0.4s ease;
      }
      .reveal-banner .you-picked {
        font-size: 13px;
        color: var(--ewa-text-dim);
        margin-bottom: 6px;
      }
      .reveal-banner .model-reveal {
        font-size: 18px;
        font-weight: 700;
      }
      .model-tag {
        display: inline-block;
        padding: 2px 10px;
        border-radius: 6px;
        font-size: 14px;
        margin: 0 2px;
      }
      .model-tag.a {
        background: var(--ewa-accent-dim);
        color: var(--ewa-accent);
      }
      .model-tag.b {
        background: rgba(227, 230, 235, 0.1);
        color: var(--ewa-text);
      }

      .vote-bar-wrap {
        margin-top: 12px;
      }
      .vote-bar-labels {
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 6px;
      }
      .vote-bar-labels .a-pct {
        color: var(--ewa-accent);
      }
      .vote-bar-labels .b-pct {
        color: var(--ewa-text-dim);
      }
      .vote-bar {
        height: 10px;
        border-radius: 5px;
        background: rgba(227, 230, 235, 0.1);
        overflow: hidden;
        display: flex;
      }
      .vote-bar .fill-a {
        background: var(--ewa-accent);
        height: 100%;
        transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .vote-bar .fill-b {
        background: rgba(227, 230, 235, 0.25);
        height: 100%;
        transition: width 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .community-note {
        font-size: 12px;
        color: var(--ewa-text-dim);
        text-align: center;
        margin-top: 8px;
      }

      .center-actions {
        text-align: center;
        margin-top: 28px;
      }

      /* ===== Results screen ===== */
      .results-hero {
        text-align: center;
        padding: 32px 16px 16px;
      }
      .results-title {
        font-size: clamp(28px, 5vw, 38px);
        font-weight: 900;
        margin-bottom: 10px;
        letter-spacing: -0.5px;
      }
      .results-sub {
        color: var(--ewa-text-dim);
        font-size: 16px;
        margin-bottom: 32px;
      }
      .your-picks {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-bottom: 40px;
      }
      .pick-row {
        background: var(--ewa-bg-card);
        border: 1px solid var(--ewa-border);
        border-radius: 12px;
        padding: 16px 18px;
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .pick-num {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: var(--ewa-accent-dim);
        color: var(--ewa-accent);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 14px;
        flex-shrink: 0;
      }
      .pick-prompt {
        flex: 1;
        font-size: 14px;
        font-weight: 500;
        line-height: 1.4;
      }
      .pick-prompt .full {
        display: block;
        color: var(--ewa-text-dim);
        font-size: 12px;
        font-weight: 400;
        margin-top: 2px;
      }
      .pick-model {
        background: var(--ewa-accent-dim);
        color: var(--ewa-accent);
        padding: 4px 10px;
        border-radius: 6px;
        font-size: 13px;
        font-weight: 700;
        white-space: nowrap;
      }

      /* ===== Leaderboard ===== */
      .leaderboard {
        background: var(--ewa-bg-card);
        border: 1px solid var(--ewa-border);
        border-radius: 16px;
        padding: 24px;
        margin-bottom: 32px;
      }
      .leaderboard-title {
        font-size: 20px;
        font-weight: 900;
        margin-bottom: 4px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .leaderboard-sub {
        font-size: 13px;
        color: var(--ewa-text-dim);
        margin-bottom: 20px;
      }
      .rank-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .rank-row {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 16px;
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid var(--ewa-border);
        border-radius: 10px;
      }
      .rank-row.first {
        border-color: var(--ewa-accent);
        background: var(--ewa-accent-dim);
      }
      .rank-pos {
        font-size: 22px;
        font-weight: 900;
        width: 32px;
        text-align: center;
        color: var(--ewa-text-dim);
      }
      .rank-row.first .rank-pos {
        color: var(--ewa-accent);
      }
      .rank-name {
        flex: 1;
        font-weight: 700;
        font-size: 16px;
      }
      .rank-bar {
        width: 90px;
        height: 6px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 3px;
        overflow: hidden;
      }
      .rank-bar .fill {
        height: 100%;
        background: var(--ewa-accent);
        border-radius: 3px;
      }
      .rank-pct {
        font-weight: 700;
        font-size: 15px;
        color: var(--ewa-accent);
        width: 52px;
        text-align: right;
      }
      .rank-crown {
        font-size: 18px;
      }

      .restart-wrap {
        text-align: center;
      }

      /* ===== Mobile ===== */
      @media (max-width: 680px) {
        body {
          padding: 16px 12px 48px;
        }
        .cards-grid {
          grid-template-columns: 1fr;
        }
        .how-it-works {
          grid-template-columns: 1fr;
          max-width: 360px;
        }
        .response-card .card-body {
          min-height: auto;
        }
        .pick-row {
          flex-wrap: wrap;
        }
        .pick-model {
          order: -1;
        }
        .leaderboard {
          padding: 18px;
        }
        .rank-bar {
          width: 56px;
        }
        .btn {
          padding: 15px 36px;
          font-size: 16px;
        }
      }
    </style>
    <script data-goatcounter="https://twbly.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
  </head>
  <body>
    <div class="container">
      <div class="site-header">
        <a href="/">← 이지워킹 AI로 돌아가기</a>
      </div>

      <!-- ===== TITLE SCREEN ===== -->
      <div class="screen active" id="screen-title">
        <div class="title-wrap">
          <span class="title-badge">🔥 매주 새로운 대결</span>
          <h1 class="title-main">AI 타격전</h1>
          <p class="title-sub">같은 질문, 두 AI의 대결.<br />당신의 선택은?</p>

          <div class="how-it-works">
            <div class="step">
              <div class="step-num">1</div>
              <div class="step-text">같은 질문에 대한<br />두 AI 답변을 비교해요</div>
            </div>
            <div class="step">
              <div class="step-num">2</div>
              <div class="step-text">더 마음에 드는 답변을<br />골라 투표해요</div>
            </div>
            <div class="step">
              <div class="step-num">3</div>
              <div class="step-text">어떤 AI였는지<br />공개! 순위도 확인</div>
            </div>
          </div>

          <button class="btn" onclick="startGame()">시작하기</button>
        </div>
      </div>

      <!-- ===== GAME SCREEN ===== -->
      <div class="screen" id="screen-game">
        <div class="progress-bar" id="progressBar"></div>

        <div class="prompt-card">
          <div class="prompt-label">📌 이번 주 질문</div>
          <div class="prompt-text" id="promptText"></div>
        </div>

        <div class="cards-grid" id="cardsGrid"></div>

        <div id="revealSection"></div>
      </div>

      <!-- ===== RESULTS SCREEN ===== -->
      <div class="screen" id="screen-results">
        <div class="results-hero">
          <h2 class="results-title">이번 주 당신의 선택 ⚡</h2>
          <p class="results-sub">3라운드의 대결이 끝났어요. 결과를 확인해보세요!</p>
        </div>

        <div class="your-picks" id="yourPicks"></div>

        <div class="leaderboard">
          <div class="leaderboard-title">🏆 이번 주 타격전 순위</div>
          <div class="leaderboard-sub">전체 투표 기준 승률 (매주 월요일 업데이트)</div>
          <div class="rank-list" id="rankList"></div>
        </div>

        <div class="restart-wrap">
          <button class="btn btn-secondary" onclick="restartGame()">🔄 다시 하기</button>
        </div>
      </div>
    </div>

    <script>
      // ============================================================
      //  AI 타격전 — 샘플 데이터
      //  3개의 대결. 각 AI는 스타일이 다르게 작성됨.
      // ============================================================
      const matchups = [
        {
          prompt: "회의록을 핵심만 3줄로 요약해줘",
          optionA: {
            model: "GPT-4o",
            text: "1. Q3 마케팅 예산은 기존 대비 15% 증액, 디지털 광고 중심으로 재배분\n2. 신제품 출시일 9월 12일로 확정, 사전예약 캠페인은 8월 중 진행\n3. 다음 회의는 금요일 오전 10시, 영업팀 실적 리뷰 포함",
          },
          optionB: {
            model: "Claude",
            text: "• 예산: Q3 마케팅비 15% 증액 확정, 인플루언서·퍼포먼스 광고로 집중\n• 일정: 신제품 9/12 출시, 8월 중 사전예약 돌입 (마케팅팀 주도)\n• 후속: 금요일 10시 회의에서 영업 실적 점검 및 세부 실행계획 수립",
          },
          communityVotes: { a: 58, b: 42 },
        },
        {
          prompt: "거래처에 일정 변경을 요청하는 정중한 이메일 써줘",
          optionA: {
            model: "Gemini",
            text: "제목: [요청] 미팅 일정 변경의 건\n\nOO 담당자님, 안녕하십니까.\n\n다름이 아니오라, 다음 주 수요일로 예정되어 있던 미팅과 관련하여 부득이하게 일정 변경을 요청드리고자 연락드렸습니다.\n\n내부 사정으로 인해 당일 참석이 어려워져, 목요일(10/24) 오전이나 금요일(10/25) 오후 중으로 일정 조정이 가능하신지 문의드립니다.\n\n불편을 드려 죄송하며, 변경된 일정으로 회신 주시면 감사하겠습니다.\n\nOO 드림",
          },
          optionB: {
            model: "GPT-4o",
            text: "제목: 수요일 미팅 일정 변경 요청드립니다\n\nOO 담당자님, 안녕하세요.\n\n수요일 미팅 일정을 변경하고 싶어 연락드렸습니다.\n\n간단히 말씀드리면, 이번 주 내부 일정이 겹쳐 기존 약속을 지키기 어려울 것 같습니다. 혹시 목요일 오전이나 금요일 오후로 옮겨도 괜찮으실까요?\n\n번거롭게 해드려 죄송합니다. 편하신 시간 알려주시면 맞추도록 하겠습니다.\n\n감사합니다.\nOO 드림",
          },
          communityVotes: { a: 34, b: 66 },
        },
        {
          prompt: "지난 분기 매출 데이터를 보고 핵심 인사이트 3가지를 뽑아줘",
          optionA: {
            model: "Claude",
            text: "지난 분기 매출에서 주목할 만한 3가지 인사이트입니다.\n\n1️⃣ 온라인 채널 성장세가 뚜렷합니다\n온라인 매출이 전년 대비 +42% 성장했고, 전체 매출에서 차지하는 비중이 31%에서 44%로 확대됐습니다. 반면 오프라인은 8% 감소했습니다.\n\n2️⃣ 신규 고객보다 재구매가 핵심입니다\n매출의 68%가 기존 고객의 재구매에서 발생했습니다. 신규 고객 유치는 정체 중이므로, 리텐션 강화가 단기적 우선순위로 보입니다.\n\n3️⃣ B2B 거래처 편중 리스크\n상위 3개 거래처가 전체 매출의 47%를 차지합니다. 한 곳이라도 이탈할 경우 매출 타격이 크므로 거래처 다변화가 필요합니다.",
          },
          optionB: {
            model: "Gemini",
            text: "📊 3분기 매출 핵심 요약\n\n• 온라인 강세: 전년 대비 +42% 성장, 매출 비중 44%로 확대 (오프라인 -8%)\n• 재구매 중심: 기존 고객 재구매가 전체 매출의 68% 차지. 신규 유치 정체 추세\n• 거래처 집중도: 상위 3개사가 매출의 47%. 의존도 완화 필요\n\n💡 제언: 온라인 투자 지속 + 재구매 캠페인 강화 + 신규 거래처 개발 병행 추천",
          },
          communityVotes: { a: 71, b: 29 },
        },
      ]

      // ============================================================
      //  상태 관리
      // ============================================================
      let currentRound = 0
      let userPicks = [] // 각 라운드에서 사용자가 선택한 옵션 ('a' 또는 'b')

      // 순위 계산용: 커뮤니티 투표를 합산해 모델별 승률(점유율) 추정
      function computeLeaderboard() {
        const stats = {}
        matchups.forEach((m) => {
          const a = m.optionA.model,
            b = m.optionB.model
          stats[a] = stats[a] || { votes: 0 }
          stats[b] = stats[b] || { votes: 0 }
          stats[a].votes += m.communityVotes.a
          stats[b].votes += m.communityVotes.b
        })
        const total = Object.values(stats).reduce((s, x) => s + x.votes, 0)
        return Object.entries(stats)
          .map(([name, d]) => ({ name, pct: Math.round((d.votes / total) * 100) }))
          .sort((x, y) => y.pct - x.pct)
      }

      // ============================================================
      //  화면 전환
      // ============================================================
      function showScreen(id) {
        document.querySelectorAll(".screen").forEach((s) => s.classList.remove("active"))
        document.getElementById(id).classList.add("active")
        window.scrollTo({ top: 0, behavior: "smooth" })
      }

      // ============================================================
      //  게임 시작
      // ============================================================
      function startGame() {
        currentRound = 0
        userPicks = []
        showScreen("screen-game")
        renderRound()
      }

      // ============================================================
      //  라운드 렌더링
      // ============================================================
      function renderProgress() {
        const bar = document.getElementById("progressBar")
        let html = `<span>${currentRound + 1} / ${matchups.length}</span>`
        for (let i = 0; i < matchups.length; i++) {
          let cls = "progress-dot"
          if (i < currentRound) cls += " done"
          else if (i === currentRound) cls += " current"
          html += `<div class="${cls}"></div>`
        }
        bar.innerHTML = html
      }

      function renderRound() {
        const m = matchups[currentRound]
        renderProgress()

        document.getElementById("promptText").textContent = m.prompt

        const grid = document.getElementById("cardsGrid")
        grid.innerHTML = `
    <div class="response-card" id="cardA" onclick="vote('a')">
      <div class="card-header">
        <div class="card-label">A</div>
        <div class="card-label-text">AI A의 답변</div>
      </div>
      <div class="card-body">${escapeHtml(m.optionA.text)}</div>
      <button class="card-vote-btn" onclick="event.stopPropagation(); vote('a')">A 선택</button>
    </div>
    <div class="response-card" id="cardB" onclick="vote('b')">
      <div class="card-header">
        <div class="card-label">B</div>
        <div class="card-label-text">AI B의 답변</div>
      </div>
      <div class="card-body">${escapeHtml(m.optionB.text)}</div>
      <button class="card-vote-btn" onclick="event.stopPropagation(); vote('b')">B 선택</button>
    </div>
  `

        document.getElementById("revealSection").innerHTML = ""
      }

      // ============================================================
      //  투표 & 공개
      // ============================================================
      function vote(choice) {
        userPicks[currentRound] = choice
        const m = matchups[currentRound]

        // 카드 시각 처리
        const cardA = document.getElementById("cardA")
        const cardB = document.getElementById("cardB")
        cardA.onclick = null
        cardB.onclick = null
        cardA.querySelector(".card-vote-btn").onclick = null
        cardB.querySelector(".card-vote-btn").onclick = null

        if (choice === "a") {
          cardA.classList.add("selected")
          cardB.classList.add("faded")
        } else {
          cardB.classList.add("selected")
          cardA.classList.add("faded")
        }

        // 리뷌 섹션
        const aModel = m.optionA.model
        const bModel = m.optionB.model
        const pickedModel = choice === "a" ? aModel : bModel
        const otherModel = choice === "a" ? bModel : aModel
        const aPct = m.communityVotes.a
        const bPct = m.communityVotes.b

        const agreeText =
          (choice === "a" && aPct >= bPct) || (choice === "b" && bPct >= aPct)
            ? `🎉 다른 ${Math.max(aPct, bPct)}%도 당신과 같은 선택을 했어요!`
            : `🔮 소수파! 다수는 ${Math.max(aPct, bPct)}%가 반대편을 골랐어요. 독특한 안목이네요.`

        document.getElementById("revealSection").innerHTML = `
    <div class="reveal-banner">
      <div class="you-picked">당신의 선택 → <strong>${choice.toUpperCase()}</strong></div>
      <div class="model-reveal">
        <span class="model-tag a">A = ${aModel}</span>
        <span class="model-tag b">B = ${bModel}</span>
      </div>
      <div class="vote-bar-wrap">
        <div class="vote-bar-labels">
          <span class="a-pct">A ${aPct}%</span>
          <span class="b-pct">${bPct}% B</span>
        </div>
        <div class="vote-bar">
          <div class="fill-a" style="width:0"></div>
          <div class="fill-b" style="width:0"></div>
        </div>
        <div class="community-note">${agreeText}</div>
      </div>
    </div>
    <div class="center-actions">
      ${
        currentRound < matchups.length - 1
          ? `<button class="btn" onclick="nextRound()">다음 대결 →</button>`
          : `<button class="btn" onclick="showResults()">최종 결과 보기 🏁</button>`
      }
    </div>
  `

        // 애니메이션으로 바 채우기
        requestAnimationFrame(() => {
          const fills = document.querySelectorAll("#revealSection .vote-bar > div")
          fills[0].style.width = aPct + "%"
          fills[1].style.width = bPct + "%"
        })
      }

      function nextRound() {
        currentRound++
        renderRound()
      }

      // ============================================================
      //  결과 화면
      // ============================================================
      function showResults() {
        // 내 선택 요약
        const picksHtml = matchups
          .map((m, i) => {
            const choice = userPicks[i]
            const model = choice === "a" ? m.optionA.model : m.optionB.model
            return `
      <div class="pick-row">
        <div class="pick-num">${i + 1}</div>
        <div class="pick-prompt">
          ${m.prompt}
          <span class="full">${choice.toUpperCase()} 선택 → ${model}</span>
        </div>
        <div class="pick-model">${model}</div>
      </div>
    `
          })
          .join("")
        document.getElementById("yourPicks").innerHTML = picksHtml

        // 순위표
        const ranks = computeLeaderboard()
        const rankHtml = ranks
          .map((r, i) => {
            const isFirst = i === 0
            return `
      <div class="rank-row ${isFirst ? "first" : ""}">
        <div class="rank-pos">${i + 1}</div>
        <div class="rank-name">${isFirst ? '<span class="rank-crown">👑</span> ' : ""}${r.name}</div>
        <div class="rank-bar"><div class="fill" style="width:${r.pct}%"></div></div>
        <div class="rank-pct">${r.pct}%</div>
      </div>
    `
          })
          .join("")
        document.getElementById("rankList").innerHTML = rankHtml

        showScreen("screen-results")
      }

      function restartGame() {
        startGame()
      }

      // ============================================================
      //  유틸
      // ============================================================
      function escapeHtml(s) {
        return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      }
    </script>
  </body>
</html>
