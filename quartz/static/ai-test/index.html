<style>
:root{--bg:#0d1117;--surface:#161b22;--surface2:#1c2230;--border:#30363d;--text:#e6edf3;--dim:#7d8590;--blue:#58a6ff;--green:#3fb950;--orange:#f0883e;--red:#f85149;--purple:#bc8cff;--r:16px;--font:'Pretendard','Apple SD Gothic Neo',-apple-system,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;padding-top:4rem;-webkit-font-smoothing:antialiased}
.home-link{position:fixed;top:1.25rem;left:1.25rem;z-index:100;display:flex;align-items:center;gap:.4rem;font-size:.8rem;font-weight:600;color:var(--dim);text-decoration:none;padding:.45rem .75rem;border-radius:100px;transition:all .18s;background:var(--surface);border:1px solid var(--border)}
.home-link:hover{color:var(--text);border-color:var(--blue);background:var(--surface2)}
.app{width:100%;max-width:640px;min-height:480px}
.start{text-align:center;padding:2rem 1rem;animation:fi .6s ease}
.start .badge{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.15em;color:var(--blue);background:rgba(88,166,255,.1);border:1px solid rgba(88,166,255,.3);padding:.35rem .8rem;border-radius:100px;margin-bottom:1.5rem}
.start h1{font-size:clamp(1.6rem,5vw,2.2rem);font-weight:800;line-height:1.3;margin-bottom:1rem}
.start h1 em{font-style:normal;background:linear-gradient(135deg,var(--blue),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.start p{color:var(--dim);font-size:.95rem;line-height:1.7;margin-bottom:1.5rem}
.start .warn{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:1.25rem;margin-bottom:2rem;text-align:left}
.start .warn h3{font-size:.85rem;color:var(--orange);margin-bottom:.5rem}
.start .warn p{font-size:.82rem;margin:0}
.start-meta{display:flex;justify-content:center;gap:1.5rem;margin-bottom:2.5rem;flex-wrap:wrap}
.start-meta span{font-size:.8rem;color:var(--dim);display:flex;align-items:center;gap:.35rem}
.start-meta span::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--green)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;font-family:var(--font);font-size:1.05rem;font-weight:700;color:var(--bg);background:linear-gradient(135deg,var(--blue),#4c8dff);border:none;padding:1rem 2.5rem;border-radius:100px;cursor:pointer;transition:transform .15s,box-shadow .15s;text-decoration:none}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(88,166,255,.35)}
.btn:active{transform:translateY(0)}
.btn-sm{font-size:.85rem;padding:.6rem 1.2rem;border-radius:100px}
.btn-ghost{background:transparent;color:var(--dim);border:1px solid var(--border)}
.btn-ghost:hover{border-color:var(--blue);color:var(--text);box-shadow:none;transform:none}
.pwrap{margin-bottom:2rem}
.plabel{display:flex;justify-content:space-between;font-size:.75rem;color:var(--dim);margin-bottom:.5rem;font-weight:600;letter-spacing:.05em}
.pbar{height:6px;background:var(--surface);border-radius:3px;overflow:hidden}
.pfill{height:100%;background:linear-gradient(90deg,var(--blue),var(--purple));border-radius:3px;transition:width .4s cubic-bezier(.4,0,.2,1);width:0%}
.q-screen{animation:fi .4s ease}
.qnum{font-size:.75rem;font-weight:700;color:var(--blue);letter-spacing:.1em;margin-bottom:.75rem}
.qtext{font-size:1.15rem;font-weight:700;line-height:1.5;margin-bottom:.5rem}
.qscene{font-size:.88rem;color:var(--dim);line-height:1.6;margin-bottom:1.5rem;padding-left:.75rem;border-left:3px solid var(--border)}
.choices{display:flex;flex-direction:column;gap:.75rem}
.choice{display:flex;align-items:flex-start;gap:.75rem;padding:1rem 1.25rem;background:var(--surface);border:1px solid var(--border);border-radius:12px;cursor:pointer;transition:all .18s;font-size:.95rem;line-height:1.5;color:var(--text)}
.choice:hover{border-color:var(--blue);background:var(--surface2);transform:translateX(4px)}
.choice .mk{flex-shrink:0;width:22px;height:22px;border-radius:50%;border:2px solid var(--border);transition:all .18s;margin-top:1px}
.choice:hover .mk{border-color:var(--blue);background:rgba(88,166,255,.15)}
.choice.sel{border-color:var(--blue);background:rgba(88,166,255,.08)}
.choice.sel .mk{border-color:var(--blue);background:var(--blue)}
.result{animation:fi .5s ease;text-align:center}
.rbadge{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.15em;padding:.3rem .8rem;border-radius:100px;margin-bottom:.5rem}
.rtitle{font-size:clamp(1.3rem,5vw,1.7rem);font-weight:800;margin-bottom:.25rem}
.rsubtitle{font-size:.85rem;color:var(--dim);margin-bottom:1.5rem;line-height:1.6}
/* Radar chart */
.radar-wrap{display:flex;justify-content:center;margin-bottom:1.5rem}
.radar-svg{max-width:240px;width:100%;height:auto}

.score-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:1.5rem;margin-bottom:1.5rem;text-align:left}
.score-title{font-size:.75rem;font-weight:700;letter-spacing:.1em;color:var(--dim);margin-bottom:1rem}
.srow{display:flex;align-items:center;gap:.75rem;margin-bottom:.85rem}
.srow:last-child{margin-bottom:0}
.slabel{width:80px;font-size:.8rem;font-weight:600;color:var(--dim);flex-shrink:0}
.strack{flex:1;height:10px;background:var(--bg);border-radius:5px;overflow:hidden;position:relative}
.sfill{height:100%;border-radius:5px;transition:width 1s cubic-bezier(.34,1.56,.64,1);width:0%}
.srow[data-axis=T] .sfill{background:var(--blue)}
.srow[data-axis=P] .sfill{background:var(--purple)}
.srow[data-axis=V] .sfill{background:var(--green)}
.srow[data-axis=S] .sfill{background:var(--orange)}
.sval{width:45px;text-align:right;font-size:.8rem;font-weight:700;color:var(--dim);font-variant-numeric:tabular-nums}
.sval.neg{color:var(--red)}
.sval.strong{color:var(--green)}
/* Trap list */
.trap-list{list-style:none;padding:0;margin-bottom:1.5rem}
.trap-item{display:flex;align-items:flex-start;gap:.6rem;padding:.6rem .9rem;background:var(--surface);border:1px solid var(--border);border-radius:8px;margin-bottom:.5rem;font-size:.83rem;line-height:1.5;text-align:left}
.trap-item.hit{border-color:var(--red);background:rgba(248,81,73,.06)}
.trap-item .ticon{flex-shrink:0;font-size:.9rem;margin-top:1px}
.trap-item.hit .ticon{color:var(--red)}
.trap-item .tname{font-weight:700;color:var(--text)}
.trap-item.hit .tname{color:var(--red)}
.trap-item .tdesc{color:var(--dim);font-size:.78rem;margin-top:.15rem}
/* Insight cards */
.icard{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--red);border-radius:0 var(--r) var(--r) 0;padding:1.25rem 1.5rem;margin-bottom:1rem;text-align:left}
.icard.act{border-left-color:var(--green)}
.icard.book{border-left-color:var(--purple)}
.ilabel{font-size:.7rem;font-weight:700;letter-spacing:.1em;color:var(--red);margin-bottom:.5rem}
.icard.act .ilabel{color:var(--green)}
.icard.book .ilabel{color:var(--purple)}
.ibody{font-size:.9rem;line-height:1.7;color:var(--text)}
.ibody strong{color:var(--text)}
/* Email gate */
.gate{background:linear-gradient(135deg,rgba(88,166,255,.08),rgba(188,140,255,.06));border:1px solid rgba(88,166,255,.3);border-radius:var(--r);padding:1.75rem 1.5rem;margin:1.5rem 0}
.gate h3{font-size:1.05rem;margin-bottom:.5rem}
.gate p{font-size:.85rem;color:var(--dim);margin-bottom:1.25rem;line-height:1.6}
.gform{display:flex;gap:.5rem;flex-direction:column}
.gform input{font-family:var(--font);font-size:.95rem;padding:.85rem 1rem;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);outline:none;transition:border-color .2s}
.gform input:focus{border-color:var(--blue)}
.gform button{font-family:var(--font);font-size:.95rem;font-weight:700;color:var(--bg);background:var(--blue);border:none;padding:.85rem;border-radius:10px;cursor:pointer;transition:background .2s}
.gform button:hover{background:#4c8dff}
.gform button:disabled{opacity:.6;cursor:default}
.gskip{margin-top:.75rem}
.share-row{display:flex;justify-content:center;gap:.75rem;margin-top:1.5rem}
@keyframes fi{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.hidden{display:none!important}
@media(max-width:480px){body{padding:1rem;padding-top:3.5rem}.qtext{font-size:1.05rem}.choice{padding:.85rem 1rem;font-size:.9rem}.slabel{width:60px;font-size:.75rem}.radar-svg{max-width:200px}}
</style>

function classifyBase(s){
if(s.T>=2&&s.P>=2&&s.V>=2&&s.S>=2)return"system";
var negs={};["T","P","V","S"].forEach(function(a){if(s[a]<0)negs[a]=s[a]});
var keys=Object.keys(negs);
if(keys.length>0){keys.sort(function(a,b){return negs[a]-negs[b]});
var w=keys[0];if(w==="V")return"velocity";else if(w==="S")return"craft";else if(w==="P")return"overconfidence";else return"potential"}
if(s.T<1)return"potential";
var lv={T:axisLevel(s,"T"),P:axisLevel(s,"P"),V:axisLevel(s,"V"),S:axisLevel(s,"S")};
if(lv.V==="strong"&&lv.S!=="strong")return"craft";
if(lv.V!=="strong"&&lv.T==="strong")return"velocity";
if(lv.P==="strong"||lv.S==="strong")return"overconfidence";
return"potential"}

["T","P","V","S"].forEach(function(a){if(lv[a]==="strong")strongs.push(a);if(lv[a]==="weak")weaks.push(a)});

else if(weaks.length>=2){subtitle=weaks.map(function(a){return AXIS_KR[a]}).join("과 ")+(weaks.length>1?"가":"이")+" 약점입니다. 이 영역부터 보완해야 합니다。"}
else if(strongs.length===0){subtitle="아직 뚜렷한 강점이 형성되지 않았습니다. 한 영역부터 깊이 파고들어야 합니다。"}
else{subtitle=strongs.map(function(a){return AXIS_KR[a]}).join("과 ")+(strongs.length>1?"가":"이")+" 주요 강점입니다。"}

sb+='<div class="srow" data-axis="'+a+'"><span class="slabel">'+AXIS_KR[a]+'</span><div class="strack"><div class="sfill" data-t="'+pct+'"></div></div><span class="'+cls+'">'+(sc[a]>=0?"+":"")+sc[a]+"</span></div>"});
/* 함정 목록 */
var trapHTML="";
var trapKeys=Object.keys(trapHits);
if(trapKeys.length===0){trapHTML='<div class="trap-item"><span class="ticon" style="color:var(--green)">✓</span><span><span class="tname">탐지된 함정 없음</span><span class="tdesc">주의가 필요한 패턴을 피했습니다。 이 흐름을 유지하세요。</span></span></div>'}
else{var sorted=trapKeys.sort(function(a,b){return trapHits[b]-trapHits[a]});
sorted.forEach(function(tk){

trapHTML+='<div class="trap-item hit"><span class="ticon">⚠</span><span><span class="tname">'+t.name+(cnt>1?" ("+cnt+"회)":"")+'</span><span class="tdesc">'+t.desc+'</span></span></div>'})}
g("rc").innerHTML=
'<span class="rbadge" style="background:'+bt.color+'22;color:'+bt.color+';border:1px solid '+bt.color+'55">YOUR TYPE</span>'+

'<p class="rsubtitle">'+subtitle+'</p>'+

/* 레이더 차트 SVG 생성 */
function buildRadar(s){
var cx=120,cy=120,maxR=85;
var axes=["T","P","V","S"];
var colors={T:"#58a6ff",P:"#bc8cff",V:"#3fb950",S:"#f0883e"};
var pts=[];
/* 배경 그리드 (25,50,75,100%) */
var grid=[0.25,0.5,0.75,1.0];
var gridPaths="";
grid.forEach(function(g){
var gp=[];
for(var i=0;i<4;i++){
var ang=-Math.PI/2+i*Math.PI/2;
var r=maxR*g;
gp.push((cx+r*Math.cos(ang))+","+(cy+r*Math.sin(ang)))}
gridPaths+='<polygon points="'+gp.join(" ")+'" fill="none" stroke="#30363d" stroke-width="1" opacity="0.5"/>'});
/* 데이터 폴리곤 */
var dataPts=[];
var dotEls="";
axes.forEach(function(a,i){
var ang=-Math.PI/2+i*Math.PI/2;
var range=MAX[a]-MIN[a];
var norm=Math.max(0,Math.min(1,(s[a]-MIN[a])/range));
var r=maxR*norm;
var x=cx+r*Math.cos(ang);
var y=cy+r*Math.sin(ang);
dataPts.push(x+","+y);
dotEls+='<circle cx="'+x+'" cy="'+y+'" r="4" fill="'+colors[a]+'"/>'});
/* 축 선 + 라벨 */
var axisEls="";
var labelEls="";
axes.forEach(function(a,i){
var ang=-Math.PI/2+i*Math.PI/2;
var ex=cx+maxR*Math.cos(ang);
var ey=cy+maxR*Math.sin(ang);
axisEls+='<line x1="'+cx+'" y1="'+cy+'" x2="'+ex+'" y2="'+ey+'" stroke="#30363d" stroke-width="1"/>';
var lx=cx+(maxR+16)*Math.cos(ang);
var ly=cy+(maxR+16)*Math.sin(ang)+4;
axisEls+='<text x="'+lx+'" y="'+ly+'" text-anchor="middle" font-size="11" font-weight="700" fill="'+colors[a]+'">'+AXIS_KR[a]+'</text>'});
return '<svg class="radar-svg" viewBox="0 0 240 240">'+
gridPaths+axisEls+
'<polygon points="'+dataPts.join(" ")+'" fill="rgba(88,166,255,0.15)" stroke="#58a6ff" stroke-width="2"/>'+
dotEls+
'<circle cx="'+cx+'" cy="'+cy+'" r="3" fill="#7d8590"/>'+
'</svg>'}
