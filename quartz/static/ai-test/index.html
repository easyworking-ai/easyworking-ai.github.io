var MAX={T:8,P:18,V:14,S:12};
var MIN={T:-2,P:-4,V:-5,S:-2};
var cur=0,ans=[],sc={T:0,P:0,V:0,S:0};
function startTest(){cur=0;ans=[];sc={T:0,P:0,V:0,S:0};show("s-q");render()}
function render(){
var q=Q[cur],tot=Q.length,pct=Math.round(cur/tot*100);
g("pt").textContent=(cur+1)+" / "+tot;
g("pp").textContent=pct+"%";
g("pf").style.width=pct+"%";
g("qn").textContent="QUESTION "+String(cur+1).padStart(2,"0");
g("qt").textContent=q.text;
g("qs").innerHTML=q.scene||"";
g("qs").style.display=q.scene?"block":"none";
var c=g("qc");c.innerHTML="";
q.c.forEach(function(o,i){var d=document.createElement("div");d.className="choice";
d.innerHTML='<span class="mk"></span><span>'+o.t+"</span>";
d.onclick=function(){pick(i,d)};c.appendChild(d)})}
function pick(i,el){
document.querySelectorAll(".choice").forEach(function(c){c.classList.remove("sel")});
el.classList.add("sel");ans[cur]=i;
setTimeout(function(){cur++;if(cur<Q.length)render();else calc()},300)}
function calc(){
sc={T:0,P:0,V:0,S:0};
ans.forEach(function(a,qi){var w=Q[qi].c[a].w;for(var k in w)sc[k]+=w[k]});
var type;
if(sc.T>=2&&sc.P>=2&&sc.V>=2&&sc.S>=2)type="system";
else{
var negs={};["T","P","V","S"].forEach(function(a){if(sc[a]<0)negs[a]=sc[a]});
var keys=Object.keys(negs);
if(keys.length>0){
keys.sort(function(a,b){return negs[a]-negs[b]});
var worst=keys[0];
if(worst==="V")type="velocity";
else if(worst==="S")type="craft";
else if(worst==="P")type="overconfidence";
else type="potential"}
else{var lo=["T","P","V","S"].sort(function(a,b){return sc[a]-sc[b]})[0];
if(lo==="T")type="potential";else if(lo==="V")type="velocity";else if(lo==="S")type="craft";else type="overconfidence"}}
renderResult(type)}
function renderResult(tk){
var t=TYPES[tk];show("s-r");
var an={T:"도구",P:"프로세스",V:"검수",S:"확산"};
var sb="";
["T","P","V","S"].forEach(function(a){
var pct=Math.max(0,Math.round((sc[a]-MIN[a])/(MAX[a]-MIN[a])*100));
var cls=sc[a]<0?"sval neg":"sval";
sb+='<div class="srow" data-axis="'+a+'"><span class="slabel">'+an[a]+'</span><div class="strack"><div class="sfill" data-t="'+pct+'"></div></div><span class="'+cls+'">'+(sc[a]>=0?"+":"")+sc[a]+"</span></div>"});
g("rc").innerHTML='<span class="rbadge" style="background:'+t.color+'22;color:'+t.color+';border:1px solid '+t.color+'55">YOUR TYPE</span><div class="rtitle">'+t.name+'</div><p class="rtag">'+t.tag+'</p><div class="score-box">'+sb+'</div><div class="icard"><div class="ilabel">⚠️ 가장 위험한 함정</div><div class="ibody">'+t.risk+'</div></div><div class="icard act"><div class="ilabel">→ 이번 주 할 일</div><div class="ibody">'+t.act+'</div></div><div class="icard book"><div class="ilabel">📖 더 깊이</div><div class="ibody">전자책 「AI를 업무에 붙이는 기술」<br><strong>'+t.ch+'</strong>를 참고하세요.</div></div><div class="gate" id="eg"><h3>📰 결과 저장 + 새 자료 알림 받기</h3><p>이메일을 남기면 테스트 결과 요약과 전자책 출간 소식을 보내드립니다. 스팸 없음, 언제든 취소 가능.</p><form class="gform" onsubmit="submitEmail(event)"><input type="email" id="ei" placeholder="your@email.com" required><input type="text" id="ni" placeholder="이름 또는 직군 (선택)"><button type="submit" id="eb">결과 저장하고 알림 받기</button></form><div class="gskip"><a href="#" class="btn btn-sm btn-ghost" onclick="skipE();return false;">괜찮습니다, 이메일 안 남길게요</a></div></div><div class="share-row"><button class="btn btn-sm btn-ghost" onclick="copyLink()">링크 복사</button><button class="btn btn-sm btn-ghost" onclick="location.reload()">다시 하기</button></div>';
setTimeout(function(){document.querySelectorAll(".sfill").forEach(function(e){e.style.width=e.dataset.t+"%"})},200)}
async function submitEmail(e){e.preventDefault();var em=g("ei").value.trim(),nm=g("ni").value.trim();if(!em||em.indexOf("@")===-1)return;var b=g("eb");b.disabled=true;b.textContent="저장 중...";
var te=Object.entries(TYPES).find(function(p){return p[1].condition?false:false});
var tn=TYPES.overconfidence.name;
for(var k in TYPES){if(classifyType(sc)===k){tn=TYPES[k].name;break}}
var ma=["T","P","V","S"].sort(function(a,b){return sc[a]-sc[b]})[0];
var pl={email:em,name:nm,source:"ai-readiness-v3",scores:sc,weakest:ma,type:tn,consent:true};
try{var r=await fetch("https://aiee.app/webhook/ai-lead",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(pl)});
if(r.ok){b.textContent="✓ 완료! 결과를 보내드렸습니다.";setTimeout(function(){g("eg").classList.add("hidden")},1500);return}}catch(er){}
var s=encodeURIComponent("[AI 진단] 결과 저장");var bd=encodeURIComponent("이메일: "+em+"\n이름/직군: "+nm+"\n유형: "+tn+"\n점수: T"+sc.T+" P"+sc.P+" V"+sc.V+" S"+sc.S+"\n가장 낮은 축: "+ma);
window.location.href="mailto:aieeiee030303@gmail.com?subject="+s+"&body="+bd;
b.textContent="✓ 메일로 전송 중...";setTimeout(function(){g("eg").classList.add("hidden")},2000)}
function classifyType(s){
if(s.T>=2&&s.P>=2&&s.V>=2&&s.S>=2)return"system";
var negs={};["T","P","V","S"].forEach(function(a){if(s[a]<0)negs[a]=s[a]});
var keys=Object.keys(negs);
if(keys.length>0){keys.sort(function(a,b){return negs[a]-negs[b]});
var w=keys[0];if(w==="V")return"velocity";else if(w==="S")return"craft";else if(w==="P")return"overconfidence";else return"potential"}
var lo=["T","P","V","S"].sort(function(a,b){return s[a]-s[b]})[0];
if(lo==="T")return"potential";else if(lo==="V")return"velocity";else if(lo==="S")return"craft";else return"overconfidence"}
function skipE(){g("eg").classList.add("hidden")}
function copyLink(){navigator.clipboard.writeText(window.location.href).then(function(){alert("링크가 복사되었습니다.")})}
function g(id){return document.getElementById(id)}
function show(id){["s-start","s-q","s-r"].forEach(function(s){g(s).classList.add("hidden")});g(id).classList.remove("hidden")}
</script>
